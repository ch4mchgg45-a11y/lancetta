name: Aggiorna prezzi carburanti

# Il Ministero pubblica il file ogni mattina verso le 8:45 (ora italiana).
# Controlliamo due volte (09:30 e 12:00 circa) nel caso esca in ritardo:
# se i dati non sono cambiati, non succede nulla.
on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Scarica e prepara i prezzi
        run: python scripts/aggiorna_dati.py
      - name: Salva i dati aggiornati
        run: |
          git config user.name "Lancetta (aggiornamento automatico)"
          git config user.email "actions@github.com"
          git add data/
          # meta.json cambia sempre (ora di aggiornamento): salviamo solo se
          # sono cambiati davvero i prezzi
          if git diff --staged --quiet -- data/zone data/comuni.json; then
            echo "Prezzi invariati, niente da salvare."
            exit 0
          fi
          git commit -m "Prezzi carburanti aggiornati"
          for tentativo in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
