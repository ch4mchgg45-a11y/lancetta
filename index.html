<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lancetta</title>
  <meta name="description" content="I prezzi ufficiali dei carburanti vicino a te, ordinati dal più conveniente.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icona-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lancetta">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
  <header class="testata">
    <div class="riga-titolo">
      <h1 class="logo">Lancetta</h1>
      <button class="chip chip-auto" id="pulsante-auto" type="button"></button>
    </div>
    <nav class="barra-carburanti" id="barra-carburanti" aria-label="Carburante">
      <button class="chip" data-carb="benzina" type="button">Benzina</button>
      <button class="chip" data-carb="diesel" type="button">Diesel</button>
      <button class="chip" data-carb="gpl" type="button">GPL</button>
      <button class="chip" data-carb="metano" type="button">Metano</button>
    </nav>
    <div class="riga-luogo">
      <button class="luogo" id="pulsante-luogo" type="button"></button>
      <button class="raggio" id="pulsante-raggio" type="button"></button>
    </div>
  </header>

  <main>
    <section class="vista" id="vista-lista" aria-label="Lista"></section>
    <section class="vista" id="vista-mappa" aria-label="Mappa" hidden><div id="mappa"></div></section>
    <section class="vista" id="vista-preferiti" aria-label="Preferiti" hidden></section>
  </main>

  <nav class="schede" aria-label="Sezioni">
    <button class="scheda attiva" data-vista="lista" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Lista</button>
    <button class="scheda" data-vista="mappa" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></svg>Mappa</button>
    <button class="scheda" data-vista="preferiti" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>Preferiti</button>
  </nav>

  <div class="foglio-sfondo" id="foglio-sfondo" hidden></div>
  <div class="foglio" id="foglio" role="dialog" aria-modal="true" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/app.js?v=3"></script>
</body>
</html>
